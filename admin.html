<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>心愿单管理后台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%81</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #39C5BB; --accent-dark: #1FA69C; --accent-tint: #E6FAF8;
      --ink: #14201f; --muted: #8a9694; --border: #e7edec; --bg: #fff; --hover-bg: #F7FCFB;
      --danger: #e0574a; --danger-tint: #FDF0EE;
      --ease: cubic-bezier(.22,.9,.32,1);
    }

    body {
      font-family: 'Nunito', 'Noto Sans SC', sans-serif;
      background: var(--bg); color: var(--ink);
      min-height: 100vh; -webkit-font-smoothing: antialiased; line-height: 1.6;
    }
    a, button { -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }

    .page { max-width: 720px; margin: 0 auto; padding: clamp(40px, 9vw, 64px) 24px 80px; }

    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent-dark); margin-bottom: 16px; }
    h1 { font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-weight: 700; font-size: clamp(30px, 7vw, 40px); line-height: 1.1; margin-bottom: 10px; }
    .sub { color: var(--muted); font-size: .95rem; margin-bottom: 8px; }
    hr { border: none; border-top: 1px solid var(--border); margin: 32px 0 24px; }
    .label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

    .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }

    /* 表单 */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    input, textarea {
      width: 100%; font: inherit; font-size: .95rem; color: var(--ink); background: #fff;
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; outline: none;
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
    }
    textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 42px; padding: 0 24px; border-radius: 12px;
      font: inherit; font-size: .95rem; font-weight: 700; cursor: pointer; white-space: nowrap;
      transition: transform .2s var(--ease), box-shadow .2s var(--ease), background-color .2s var(--ease), border-color .2s var(--ease);
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none !important; }
    .btn-primary { background: var(--accent); color: #fff; border: none; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); background: var(--accent-dark); box-shadow: 0 10px 30px -12px rgba(20,32,31,.18); }
    .btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--border); }
    .btn-outline:hover:not(:disabled) { transform: translateY(-2px); background: var(--hover-bg); border-color: transparent; box-shadow: 0 10px 30px -12px rgba(20,32,31,.12); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
    .btn-danger:hover:not(:disabled) { background: var(--danger-tint); border-color: transparent; }
    .btn-small { height: 32px; padding: 0 14px; font-size: .82rem; border-radius: 10px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

    .parse-row { display: flex; gap: 10px; align-items: stretch; }
    .parse-row textarea { flex: 1; }
    .parse-row .btn { height: auto; min-height: 42px; align-self: flex-start; }
    @media (max-width: 520px) { .parse-row { flex-direction: column; } .parse-row .btn { width: 100%; } }

    /* 提示 */
    .msg { font-size: .88rem; border-radius: 12px; padding: 10px 14px; margin: 0 0 16px; }
    .msg:empty { display: none; }
    .msg.error { color: var(--danger); background: var(--danger-tint); }
    .msg.ok { color: var(--accent-dark); background: var(--accent-tint); }
    .msg.info { color: var(--muted); background: var(--hover-bg); border: 1px solid var(--border); }

    .login-box { max-width: 360px; }

    /* 列表 */
    .search { margin-bottom: 14px; }
    .record {
      display: flex; align-items: center; gap: 14px;
      border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
      transition: border-color .2s var(--ease), background .2s var(--ease);
    }
    .record:hover { background: var(--hover-bg); }
    .record.done .r-title { opacity: .55; text-decoration: line-through; text-decoration-color: var(--muted); }
    .r-thumb {
      width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--border);
      background: var(--hover-bg); overflow: hidden; display: flex; align-items: center; justify-content: center;
      font-family: 'Baloo 2', sans-serif; font-weight: 700; color: var(--muted);
    }
    .r-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .r-main { min-width: 0; flex: 1; }
    .r-title { font-weight: 700; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-sub { font-size: .8rem; color: var(--muted); }
    .r-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    @media (max-width: 560px) {
      .record { flex-wrap: wrap; }
      .r-actions { width: 100%; justify-content: flex-start; }
    }
    .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  </style>
</head>
<body>
<div class="page">

  <!-- 登录 -->
  <section id="login-view" hidden>
    <p class="eyebrow">Admin</p>
    <h1>心愿单后台</h1>
    <p class="sub">请输入管理员密码。</p>
    <hr>
    <div id="login-msg" class="msg"></div>
    <form id="login-form" class="login-box">
      <div class="field">
        <label for="login-password">管理员密码</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary" id="login-submit">登录</button>
    </form>
  </section>

  <!-- 后台 -->
  <section id="dash-view" hidden>
    <div class="head">
      <div>
        <p class="eyebrow">Admin</p>
        <h1>心愿单后台</h1>
        <p class="sub"><a href="/" style="color:var(--accent-dark);text-decoration:none;font-weight:700">查看前台页面</a></p>
      </div>
      <button class="btn btn-outline btn-small" id="logout-btn">退出登录</button>
    </div>
    <hr>

    <div id="dash-msg" class="msg"></div>

    <span class="label" id="form-title">添加心愿</span>
    <div class="field">
      <label for="raw">粘贴商品链接或 App 里的整段分享文案</label>
      <div class="parse-row">
        <textarea id="raw" placeholder="支持淘宝 / 天猫 / 拼多多 / 京东，短链也可以"></textarea>
        <button type="button" class="btn btn-outline" id="parse-btn">解析</button>
      </div>
    </div>

    <form id="wish-form">
      <input type="hidden" id="wid" />
      <div class="field"><label for="f-title">标题</label><input id="f-title" maxlength="120" required /></div>
      <div class="row2">
        <div class="field"><label for="f-price">价格（元）</label><input id="f-price" type="number" min="0" step="0.01" placeholder="选填" /></div>
        <div class="field"><label for="f-note">备注</label><input id="f-note" maxlength="200" placeholder="颜色 / 尺码 / 想要的理由" /></div>
      </div>
      <div class="field"><label for="f-url">商品链接</label><input id="f-url" type="url" required /></div>
      <div class="field"><label for="f-image">图片地址</label><input id="f-image" type="url" placeholder="选填，没抓到主图时可以手动贴图片链接" /></div>
      <div class="actions">
        <button type="submit" class="btn btn-primary" id="submit-btn">添加心愿</button>
        <button type="button" class="btn btn-outline" id="cancel-btn" hidden>取消编辑</button>
      </div>
    </form>

    <hr>
    <span class="label">全部心愿</span>
    <div class="search"><input id="search" placeholder="按标题搜索…" /></div>
    <div id="list"></div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const PLAT = { taobao: '淘宝', pdd: '拼多多', jd: '京东', other: '其他' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let wishes = [], msgTimer;

  function msg(el, text, kind) {
    el.textContent = text || ''; el.className = 'msg' + (kind ? ' ' + kind : '');
    if (el === $('dash-msg') && kind === 'ok') { clearTimeout(msgTimer); msgTimer = setTimeout(() => msg(el, ''), 2500); }
  }
  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
    let data = {}; try { data = await res.json(); } catch {}
    if (res.status === 401 && !path.startsWith('/api/auth/')) { show(false); throw new Error('登录已过期，请重新登录'); }
    if (!res.ok) throw new Error(data.error || '操作失败');
    return data;
  }
  function show(loggedIn) { $('login-view').hidden = loggedIn; $('dash-view').hidden = !loggedIn; }

  /* ── 登录 / 退出 ── */
  async function init() {
    try { const s = await api('/api/auth/status'); show(s.loggedIn); if (s.loggedIn) load(); else show(false); }
    catch { show(false); msg($('login-msg'), '无法连接服务器，请检查网络后重试', 'error'); }
  }
  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault(); const b = $('login-submit'); b.disabled = true; msg($('login-msg'), '');
    try {
      await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ password: $('login-password').value }) });
      $('login-password').value = ''; show(true); load();
    } catch (err) { msg($('login-msg'), err.message, 'error'); }
    b.disabled = false;
  });
  $('logout-btn').addEventListener('click', async () => { await api('/api/auth/logout', { method: 'POST' }).catch(() => {}); show(false); });

  /* ── 解析 ── */
  async function doParse() {
    const raw = $('raw').value.trim(); if (!raw) return;
    const b = $('parse-btn'); b.disabled = true; b.textContent = '解析中…'; msg($('dash-msg'), '');
    try {
      const r = await api('/api/admin/parse?q=' + encodeURIComponent(raw));
      $('f-url').value = r.url || '';
      if (r.title) $('f-title').value = r.title;
      if (r.price) $('f-price').value = r.price;
      if (r.image) $('f-image').value = r.image;
      if (r.partial) msg($('dash-msg'), '已识别平台和商品 ID，' + (!r.title ? '标题' : '主图') + '没抓到（平台反爬），请手动补充后保存', 'info');
      else msg($('dash-msg'), '解析成功，确认后点「添加心愿」', 'ok');
      $('f-title').focus();
    } catch (err) { msg($('dash-msg'), err.message, 'error'); }
    b.disabled = false; b.textContent = '解析';
  }
  $('parse-btn').addEventListener('click', doParse);
  $('raw').addEventListener('paste', () => setTimeout(() => { if (/https?:\/\//.test($('raw').value)) doParse(); }, 0));

  /* ── 增 / 改 ── */
  function resetForm() {
    $('wish-form').reset(); $('raw').value = ''; $('wid').value = '';
    $('form-title').textContent = '添加心愿'; $('submit-btn').textContent = '添加心愿'; $('cancel-btn').hidden = true;
  }
  $('cancel-btn').addEventListener('click', resetForm);
  $('wish-form').addEventListener('submit', async (e) => {
    e.preventDefault(); const id = $('wid').value, b = $('submit-btn'); b.disabled = true;
    const body = JSON.stringify({ title: $('f-title').value, price: $('f-price').value, note: $('f-note').value, url: $('f-url').value, image: $('f-image').value });
    try {
      await api(id ? '/api/admin/wishes/' + id : '/api/admin/wishes', { method: id ? 'PUT' : 'POST', body });
      msg($('dash-msg'), id ? '已保存' : '已添加', 'ok'); resetForm(); await load();
    } catch (err) { msg($('dash-msg'), err.message, 'error'); }
    b.disabled = false;
  });

  /* ── 列表 ── */
  async function load() {
    try { wishes = await api('/api/wishes'); render(); } catch (err) { msg($('dash-msg'), err.message, 'error'); }
  }
  function render() {
    const q = $('search').value.trim().toLowerCase();
    const list = wishes.filter((w) => !q || w.title.toLowerCase().includes(q));
    $('list').innerHTML = list.length ? list.map((w) => `
      <div class="record${w.done ? ' done' : ''}" data-id="${w.id}">
        <div class="r-thumb">${w.image ? `<img src="${esc(w.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : esc((PLAT[w.platform] || '?')[0])}</div>
        <div class="r-main">
          <div class="r-title">${esc(w.title)}</div>
          <div class="r-sub">${PLAT[w.platform] || '其他'}${w.price != null ? ' · ¥' + w.price : ''}${w.note ? ' · ' + esc(w.note) : ''}</div>
        </div>
        <div class="r-actions">
          <button class="btn btn-outline btn-small" data-a="done">${w.done ? '取消实现' : '标记实现'}</button>
          <button class="btn btn-outline btn-small" data-a="edit">编辑</button>
          <button class="btn btn-danger btn-small" data-a="del">删除</button>
        </div>
      </div>`).join('') : '<div class="empty">还没有心愿，先在上面添加一个吧</div>';
  }
  $('search').addEventListener('input', render);
  $('list').addEventListener('error', (e) => {
    if (e.target.tagName === 'IMG') { const p = e.target.parentNode; p.textContent = '🎁'; }
  }, true);
  $('list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-a]'); if (!btn) return;
    const id = btn.closest('.record').dataset.id, w = wishes.find((x) => String(x.id) === id);
    try {
      if (btn.dataset.a === 'done') { await api('/api/admin/wishes/' + id, { method: 'PUT', body: JSON.stringify({ done: !w.done }) }); await load(); }
      if (btn.dataset.a === 'del' && confirm('确定删除「' + w.title + '」？')) { await api('/api/admin/wishes/' + id, { method: 'DELETE' }); msg($('dash-msg'), '已删除', 'ok'); await load(); }
      if (btn.dataset.a === 'edit') {
        $('wid').value = id; $('f-title').value = w.title; $('f-price').value = w.price ?? ''; $('f-note').value = w.note || '';
        $('f-url').value = w.url; $('f-image').value = w.image || '';
        $('form-title').textContent = '编辑心愿'; $('submit-btn').textContent = '保存修改'; $('cancel-btn').hidden = false;
        $('form-title').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    } catch (err) { msg($('dash-msg'), err.message, 'error'); }
  });

  init();
})();
</script>
</body>
</html>
