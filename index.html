<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>心愿单 · Wishlist</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%81</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:      #39C5BB;
      --accent-dark: #1FA69C;
      --accent-tint: #E6FAF8;
      --ink:      #14201f;
      --muted:    #8a9694;
      --border:   #e7edec;
      --bg:       #ffffff;
      --card-bg:  #ffffff;
      --hover-bg: #F7FCFB;
      --shadow:   0 10px 30px -12px rgba(20,32,31,.12);
      --ease:     cubic-bezier(.22,.9,.32,1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent-tint: rgba(69,214,203,.14);
        --ink:      #eef5f4;
        --muted:    #93a19e;
        --border:   #223330;
        --bg:       #0f1615;
        --card-bg:  #131c1b;
        --hover-bg: #16211f;
        --shadow:   0 10px 30px -12px rgba(0,0,0,.5);
      }
    }

    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color .3s, color .3s;
    }

    a, button { -webkit-tap-highlight-color: transparent; }

    .page {
      max-width: 1600px;
      margin: 0 auto;
      padding: clamp(28px, 5vw, 56px) clamp(20px, 4vw, 48px) 56px;
    }

    /* ── Stagger fade-in ── */
    .page > *, .topbar > * {
      opacity: 0;
      transform: translateY(14px);
      animation: up .55s var(--ease) forwards;
      animation-delay: calc(var(--i, 0) * 0.06s);
    }
    @keyframes up { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .page > *, .topbar > *, .wish { animation: none !important; opacity: 1 !important; transform: none !important; }
      html { scroll-behavior: auto; }
    }

    /* ── Header ── */
    .topbar { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 8px; max-width: 460px; }

    .eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: .18em;
      text-transform: uppercase; color: var(--accent-dark); margin-bottom: 14px;
    }
    .topbar h1 {
      font-family: 'Baloo 2', 'Noto Sans SC', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2rem); font-weight: 700; margin-bottom: 10px;
    }
    .h1-sub { color: var(--muted); font-weight: 500; }
    .subtitle { color: var(--muted); font-size: .95rem; max-width: 400px; }
    .subtitle strong { color: var(--ink); }

    hr { border: none; border-top: 1px solid var(--border); margin: 36px 0 24px; }

    .label {
      font-size: 11px; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted);
    }

    /* ── 筛选 ── */
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      font: inherit; font-size: .85rem; font-weight: 700; color: var(--muted);
      background: transparent; border: 1px solid var(--border); border-radius: 10px;
      padding: 5px 14px; cursor: pointer;
      transition: border-color .2s var(--ease), background-color .2s var(--ease), color .2s var(--ease);
    }
    .chip:hover { background: var(--hover-bg); color: var(--ink); }
    .chip[aria-pressed="true"] { color: var(--accent-dark); border-color: var(--accent); background: var(--accent-tint); }
    .chip small { font-weight: 600; opacity: .7; margin-left: 4px; }

    /* ── 卡片网格 ── */
    .wish-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: clamp(12px, 1.6vw, 20px);
      width: 100%;
    }

    .wish {
      display: flex; align-items: center; gap: 16px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 20px 16px 16px;
      text-decoration: none; color: inherit;
      opacity: 0; transform: translateY(14px);
      animation: up .5s var(--ease) forwards;
      animation-delay: calc(var(--i, 0) * 0.05s);
      transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
    }
    .wish:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: transparent; }

    .thumb {
      width: 84px; height: 84px; flex-shrink: 0;
      border-radius: 14px; border: 1px solid var(--border);
      background: var(--hover-bg); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Baloo 2', 'Noto Sans SC', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--muted);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    .info { min-width: 0; flex: 1; }

    .badge {
      display: inline-block; font-size: .65rem; font-weight: 700; letter-spacing: .03em;
      color: var(--accent-dark); background-color: var(--accent-tint);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 5px; padding: 1px 5px; margin-bottom: 4px;
    }

    .wish-title {
      font-size: 1rem; font-weight: 700; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .wish-meta { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: .85rem; }
    .price { font-weight: 800; color: var(--accent-dark); }
    .wish-note {
      font-size: .82rem; color: var(--muted); margin-top: 2px;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    .wish:hover .wish-note { -webkit-line-clamp: unset; display: block; }

    .status { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,.25); }
    .wish.done .thumb, .wish.done .wish-title { opacity: .55; }

    .loading, .empty { text-align: center; color: var(--muted); grid-column: 1 / -1; padding: 40px 0; }

    /* ── 页脚 ── */
    footer { margin-top: 8px; text-align: center; color: var(--muted); font-size: .9rem; }
    .copyright { font-size: .82rem; color: #b7c0be; }
    .disclaimer { margin-top: 10px; font-size: .78rem; opacity: .75; }
    .site-footer {
      border-top: 1px solid var(--border); margin-top: 40px; padding-top: 24px;
      display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .site-footer a {
      display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600;
      color: #99a3a1; text-decoration: none; padding: 4px 8px; border-radius: 8px;
      transition: color .2s, background .2s;
    }
    .site-footer a:hover { color: var(--ink); background: var(--hover-bg); }
    .site-footer svg { width: 13px; height: 13px; }
    .sep { font-size: 12px; color: #ccc; }

    @media (max-width: 768px) { .wish-grid { grid-template-columns: 1fr; gap: 14px; } }
    @media (max-width: 560px) { .topbar { max-width: 100%; } .subtitle { max-width: 100%; } }
    @media (max-width: 380px) {
      .page { padding-left: 16px; padding-right: 16px; }
      hr { margin: 24px 0 18px; }
      .thumb { width: 68px; height: 68px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <p class="eyebrow" id="eyebrow" style="--i:0">Wishlist</p>
      <h1 style="--i:1">心愿单 <span class="h1-sub">/ Wishes</span></h1>
      <p class="subtitle" id="intro" style="--i:2"></p>
    </header>

    <hr style="--i:3">

    <div class="toolbar" style="--i:4">
      <div class="filters" id="filters"></div>
      <p class="label" id="count"></p>
    </div>

    <main class="wish-grid" id="grid" style="--i:5">
      <div class="loading">正在加载心愿...</div>
    </main>

    <hr style="--i:6">

    <footer style="--i:7">
      <p class="copyright" id="copyright"></p>
      <p class="disclaimer" id="disclaimer"></p>
    </footer>
    <div class="site-footer" id="site-footer" style="--i:8"></div>
  </div>

  <script>
  (() => {
    const CFG = window.SITE_CONFIG || {};
    const $ = (id) => document.getElementById(id);
    const PLAT = { taobao: '淘宝', pdd: '拼多多', jd: '京东', other: '其他' };

    /* 主题色 / 文案 */
    const t = CFG.themeColor;
    if (t) {
      const s = document.documentElement.style;
      if (t.accent) s.setProperty('--accent', t.accent);
      if (t.accentDark) s.setProperty('--accent-dark', t.accentDark);
      if (t.accentTint) s.setProperty('--accent-tint', t.accentTint);
    }
    if (CFG.pageTitle) document.title = CFG.pageTitle;
    if (CFG.eyebrow) $('eyebrow').textContent = CFG.eyebrow;
    $('intro').innerHTML = CFG.introHtml || '';
    $('disclaimer').textContent = CFG.disclaimer || '';
    if (CFG.footerName) $('copyright').innerHTML = '&copy; ' + new Date().getFullYear() + ' ' + esc(CFG.footerName) + '. All rights reserved.';

    const links = CFG.footerLinks || {};
    const ico = {
      user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
      gh: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/></svg>'
    };
    const parts = [];
    if (links.homepage && links.homepage.href) parts.push(`<a href="${esc(links.homepage.href)}" target="_blank" rel="noopener">${ico.user}${esc(links.homepage.name || '主页')}</a>`);
    if (links.github && links.github.href) parts.push(`<a href="${esc(links.github.href)}" target="_blank" rel="noopener">${ico.gh}GitHub</a>`);
    $('site-footer').innerHTML = parts.join('<span class="sep">·</span>');
    if (!parts.length) $('site-footer').hidden = true;

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    const safeHref = (u) => (/^https?:\/\//i.test(u) ? u : '#');
    const fmtPrice = (p) => (p == null ? '' : '¥' + Number(p).toFixed(2).replace(/\.?0+$/, ''));

    let wishes = [], filter = 'all';

    function renderFilters() {
      const n = (f) => wishes.filter(f).length;
      const defs = [['all', '全部', wishes.length]];
      for (const k of ['taobao', 'pdd', 'jd', 'other']) { const c = n((w) => w.platform === k); if (c) defs.push([k, PLAT[k], c]); }
      const d = n((w) => w.done); if (d) defs.push(['done', '已实现', d]);
      $('filters').innerHTML = defs.map(([k, name, c]) =>
        `<button class="chip" data-k="${k}" aria-pressed="${filter === k}">${name}<small>${c}</small></button>`).join('');
    }

    function render() {
      renderFilters();
      const list = wishes.filter((w) => filter === 'all' ? true : filter === 'done' ? w.done : w.platform === filter);
      const done = wishes.filter((w) => w.done).length;
      $('count').textContent = wishes.length ? `${wishes.length} 个心愿 · ${done} 个已实现` : '';
      if (!list.length) { $('grid').innerHTML = '<div class="empty">还没有心愿，过阵子再来看看～</div>'; return; }
      $('grid').innerHTML = list.map((w, i) => {
        const p = PLAT[w.platform] || PLAT.other;
        return `<a class="wish${w.done ? ' done' : ''}" href="${esc(safeHref(w.url))}" target="_blank" rel="noopener noreferrer" style="--i:${Math.min(i, 12)}">
          <div class="thumb">${w.image ? `<img src="${esc(w.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : esc(p[0])}</div>
          <div class="info">
            <span class="badge">${p}</span>
            <div class="wish-title">${esc(w.title)}</div>
            <div class="wish-meta">
              ${w.price != null ? `<span class="price">${fmtPrice(w.price)}</span>` : ''}
              ${w.done ? '<span class="status"><span class="status-dot"></span>已实现</span>' : ''}
            </div>
            ${w.note ? `<div class="wish-note">${esc(w.note)}</div>` : ''}
          </div></a>`;
      }).join('');
    }

    $('filters').addEventListener('click', (e) => {
      const b = e.target.closest('.chip'); if (!b) return;
      filter = b.dataset.k; render();
    });
    // 主图加载失败时回退到平台首字，不露出裂图标
    $('grid').addEventListener('error', (e) => {
      const img = e.target; if (img.tagName !== 'IMG') return;
      const card = img.closest('.wish'), p = card.querySelector('.badge').textContent;
      img.parentNode.textContent = p[0];
    }, true);

    fetch('/api/wishes')
      .then((r) => { if (!r.ok) throw 0; return r.json(); })
      .then((d) => { wishes = d; render(); })
      .catch(() => { $('grid').innerHTML = '<div class="empty">加载失败，请稍后刷新重试</div>'; });
  })();
  </script>
</body>
</html>
